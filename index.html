<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPORTS4FC — Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a12;
      --card: rgba(18, 25, 41, 0.88);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --red: #d91432;
      --green: #16a34a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(217, 20, 50, 0.22), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(30, 64, 175, 0.18), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .bio-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 32px 22px 26px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 14px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #ffffff, var(--red));
      box-shadow: 0 10px 28px rgba(217, 20, 50, 0.35);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-style: italic;
      font-weight: 900;
      font-size: 2.3rem;
      line-height: 1;
      letter-spacing: 0.03em;
    }

    h1 span { color: var(--red); }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 6px;
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.92rem;
      transition: transform 0.16s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .link-btn.primary {
      background: linear-gradient(135deg, #e11d48, #b91c1c);
      border-color: #fb7185;
      box-shadow: 0 10px 24px rgba(217, 20, 50, 0.28);
    }

    .link-btn.whatsapp {
      background: linear-gradient(135deg, #16a34a, #15803d);
      border-color: #22c55e;
      box-shadow: 0 10px 24px rgba(22, 163, 74, 0.25);
    }

    .left {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    .icon {
      font-size: 1.2rem;
      width: 26px;
      text-align: center;
    }

    .desc {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.78);
      margin-top: 2px;
    }

    .arrow {
      font-size: 1rem;
      opacity: 0.75;
    }

    footer {
      margin-top: 24px;
      font-size: 0.74rem;
      color: var(--muted);
    }
  </style>
</head>
